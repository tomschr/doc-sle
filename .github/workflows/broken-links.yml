
name: Check Broken Links

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    # Define job-level variables here for easy maintenance
    env:
      PREPROCESS: "preprocess.sh"
      LYCHEE_REPORT: "broken-links.md"
      DOCBOOK_XSL_PATH: "/usr/share/xml/docbook/stylesheet/docbook-xsl-ns/xhtml/docbook.xsl"

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor pandoc libxml2-utils xsltproc docbook-xsl-ns

      - name: Save PR Number
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

      # Maybe fetch that from an external source?
      - name: Create Lychee config
        run: |
          cat > lychee.toml << EOF
          # Verbose program output
          # Accepts log level: "error", "warn", "info", "debug", "trace"
          verbose = "debug"
          # Path to summary output file.
          output = "broken-links.md"
          # Preprocess input files
          preprocess = { command = "${{ env.PREPROCESS }}" }
          # Only check local files
          offline = true
          #
          exclude = [
            "mailto:.*",
            # Namespaces. Probably not really used, but you never know:
            "^http://www\\.w3\\.org/2005/11/its$",
            "^http://docbook\\.org/ns/docbook",
            "^http://www\\.w3\\.org/1999/xlink$",
            "^http://www\\.suse\\.com/1.0/configns$",
            "^ipp://.*",
            "^scanner\\.sane:.*",
            "^ftp://.*",
            "^file://.*",
          ]
          #
          exclude_path = [
              "(^|/)test/",   # skip directories named "test"
              "(^|/)build/",  # skip directories named "build"
              # "(^|/)l10n/",   # skip l10n directories
          ]
          EOF

      - name: Create ${{ env.PREPROCESS }}
        run: |
          cat > ${{ env.PREPROCESS }} << 'EOF'
          #!/usr/bin/env bash
          # Use 'set -e' to exit on any error in the conversion process
          set -e

          case "$1" in
            *.adoc|*.asciidoc)
                asciidoctor -a stylesheet! "$1" -o -
                ;;

            *.xml)
                # It's quick and doesn't requires daps, maybe there is even an easier way:
                # xmllint --noent "$1" | pandoc --from=docbook --to=html -
                xsltproc --xinclude "${DOCBOOK_XSL_PATH}" "$1"
                ;;

            *.html|*.htm)
              # identity function, output input without changes
              exec cat
          esac
          EOF
          # Make it executable
          chmod +x ${{ env.PREPROCESS }}

      - name: Find files
        id: find_files
        run: |
          # Find the files (excluding schemas.xml) and join them into a single string
          FILES=$(find . -type f \( -name "*.adoc" -o -name "*.xml" \) \
              -not -name "schemas.xml" \
             | tr '\n' ' ')
          echo "file_list=$FILES" >> $GITHUB_OUTPUT

      - name: Check links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: lycheeverse/lychee-action@v2
        with:
          # Remap live URLs to build directory because the links are potentially not live (not yet on main/master)
          args: |
            ${{ steps.find_files.outputs.file_list }}
          fail: true
          output: ${{ env.LYCHEE_REPORT }}

      - name: Upload Broken Links Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: link-check-results
          path: |
            ${{ env.LYCHEE_REPORT }}
            pr_number.txt
